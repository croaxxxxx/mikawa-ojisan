const lines=[
"なんしとるだん？",
"ほい、元気かん？",
"おみゃあ、ええ顔しとるじゃん。",
"押してくれてありがとな。",
"だもんで言ったじゃん。",

const img=document.getElementById("ojisan");
const text=document.getElementById("text");

let angryMode=false;
let taps=[];
let idleTimer=null;
let recoverTimer=null;

function hideText(){
 text.style.display="none";
}

function startIdleCountdown(){
 clearTimeout(idleTimer);
 idleTimer=setTimeout(()=>{
   if(!angryMode) hideText();
 },7000);
}

function recover(){
 angryMode=false;
 img.src=NORMAL;
}

img.addEventListener("click",()=>{
 const now=Date.now();

 taps=taps.filter(t=>now-t<700);
 taps.push(now);

 clearTimeout(recoverTimer);

 if(!angryMode && taps.length>=8){
    angryMode=true;
    img.src=ANGRY;
    hideText();
    recoverTimer=setTimeout(recover,800);
    return;
 }

 if(angryMode){
    recoverTimer=setTimeout(recover,800);
    return;
 }

 text.textContent=lines[Math.floor(Math.random()*lines.length)];
 text.style.display="block";
 startIdleCountdown();
});
